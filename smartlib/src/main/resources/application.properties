# ==============================================================================
# SmartLib Application Configuration (Stage 1: Foundation)
# ==============================================================================

# Application Meta
spring.application.name=smartlib
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# MySQL Database Connection (via Environment Variables)
# Defaults to localhost:3306/smartlib_db if host/port/name are not overridden.
# DB_USERNAME and DB_PASSWORD MUST be supplied via environment variables.
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartlib_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail-Fast Database Validation on Startup
# HikariCP fails application startup immediately if MySQL is unreachable.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration for Development
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# ------------------------------------------------------------------------------
# Static Resources Configuration (CSS, JS, Images)
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ------------------------------------------------------------------------------
# Borrowing Policy Configuration (Stage 4)
# ------------------------------------------------------------------------------
smartlib.borrowing.max-loans=${MAX_LOANS:3}
smartlib.borrowing.loan-duration-days=${LOAN_DURATION_DAYS:14}

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.smartlib=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
