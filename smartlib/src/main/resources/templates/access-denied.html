<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Access Denied - SmartLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="site-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="site-main">
        <div class="container placeholder-page">
            <div class="placeholder-card error-card">
                <div class="placeholder-icon-wrap error-icon-wrap">
                    <svg class="placeholder-icon text-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <div class="status-badge badge-error">HTTP 403 Forbidden</div>
                <h1 class="placeholder-title">Access Denied</h1>
                <p class="placeholder-text">
                    You do not possess the required <strong>ROLE_ADMIN</strong> privileges to access the administrative section. This area is strictly reserved for library staff and system administrators.
                </p>
                <div class="placeholder-actions">
                    <a th:href="@{/dashboard}" class="btn btn-primary">Return to My Dashboard</a>
                    <a th:href="@{/}" class="btn btn-secondary">Homepage</a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
